[project]
name = "algo-trading-platform"
version = "0.1.0"
description = "Algorithmic trading platform with Dhan integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.*",
    "uvicorn[standard]==0.29.*",
    "sqlalchemy[asyncio]==2.0.*",
    "greenlet==3.0.*",
    "alembic==1.13.*",
    "asyncpg==0.29.*",
    "redis==5.0.*",
    "pydantic==2.7.*",
    "pydantic-settings==2.3.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[bcrypt]==1.7.*",
    "python-multipart==0.0.*",
    "httpx==0.27.*",
    "websockets==12.0.*",
    "pandas==2.2.*",
    "numpy==1.26.*",
    "ta-lib==0.4.*",
    "python-telegram-bot==21.6.*",
    "prometheus-client==0.19.*",
    "structlog==24.1.*",
    "python-json-logger==2.0.*",
    "cryptography==42.0.*",
    "pyotp==2.9.*",
    "tenacity==8.2.*",
    "apscheduler==3.10.*",
    "celery==5.4.*",
    "flower==2.0.*",
    "email-validator==2.1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==4.1.*",
    "pytest-mock==3.14.*",
    "httpx==0.27.*",
    "faker==25.1.*",
    "ruff==0.4.*",
    "mypy==1.9.*",
    "pre-commit==3.6.*",
]
backtest = [
    "vectorbt==0.29.*",
    "empyrical==0.5.*",
    "quantstats==0.0.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "C90"]
ignore = ["E501"]
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"